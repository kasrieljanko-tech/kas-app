:root{

  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",system-ui,sans-serif;

}

  --bg:#000000; --surface:#1c1c1e; --fg:#ffffff; --muted:#98989f; --soft:#d1d1d6; --line:#38383a; --line2:#2c2c2e; --fill:#7676803d;
  --accent:#0a84ff; --accent-fg:#ffffff; --accent-soft:#0a2a4d;
  --ink:#f2f2f7; --ink-fg:#000000; --ink-sub:#636366;
  --been:#30d158; --been-soft:#0f2e18; --warn:#ff9f0a; --warn-soft:#3a2a10; --red:#ff453a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1c1c1e; --fg:#ffffff; --muted:#98989f; --soft:#d1d1d6; --line:#38383a; --line2:#2c2c2e; --fill:#7676803d;
  --accent:#0a84ff; --accent-fg:#ffffff; --accent-soft:#0a2a4d;
  --ink:#f2f2f7; --ink-fg:#000000; --ink-sub:#636366;
  --been:#30d158; --been-soft:#0f2e18; --warn:#ff9f0a; --warn-soft:#3a2a10; --red:#ff453a; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit}
a{color:var(--accent)}
.wrap{max-width:560px;margin:0 auto;padding-block:24px 120px;
  padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:18px}
.view{display:flex;flex-direction:column;gap:18px}
h1,h2,.disp{font-family:var(--display)}
h1{margin:0;font-weight:800;font-size:2rem;letter-spacing:-.02em;line-height:1.05;text-wrap:balance}
h2{margin:0;font-weight:600;font-size:1.15rem}
.muted{color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hello small{display:block;color:var(--muted);font-size:.95rem;margin-bottom:2px}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none;text-decoration:none;color:var(--fg)}
.round.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.editlink{font-size:.82rem;font-weight:700;color:var(--accent)}
.nudge{background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:12px 14px;font-size:.9rem;font-weight:600;display:flex;gap:10px;align-items:center}
.pphoto{display:flex;gap:14px;align-items:center}
.pphoto .av{width:84px;height:84px;font-size:2rem}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* next date hero */
.hero{background:var(--accent);color:var(--accent-fg);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.hero .lbl{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.hero .who{display:flex;gap:14px;align-items:center}
.hero .av{width:56px;height:56px;font-size:1.4rem;background:rgba(255,255,255,.22);color:inherit}
.hero .big{font-family:var(--display);font-weight:600;font-size:1.4rem;line-height:1.15}
.hero .sub{font-size:.95rem;opacity:.92}
.hero .tip{font-size:.9rem;background:rgba(0,0,0,.16);border-radius:12px;padding:10px 12px;line-height:1.4}
.hero .row2{display:flex;gap:8px}
.hero .row2 > *{flex:1;text-align:center;border-radius:12px;padding:12px;font-weight:700;font-size:.95rem;text-decoration:none;border:0;cursor:pointer}
.hero .w{background:#ffffff;color:#b0245a}
.hero .g{background:rgba(255,255,255,.2);color:inherit}
.calm{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:6px}
.calm .big{font-family:var(--display);font-weight:600;font-size:1.25rem}

.cta{display:flex;align-items:center;justify-content:space-between;background:var(--ink);color:var(--ink-fg);border-radius:18px;padding:18px 20px;border:0;cursor:pointer;text-align:left;width:100%}
.cta .t{font-family:var(--display);font-weight:600;font-size:1.25rem;display:block}
.cta .s{font-size:.9rem;color:var(--ink-sub);display:block}

.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:.9rem;cursor:pointer;padding:4px 0}

/* rows & cards */
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;width:100%;text-align:left;cursor:pointer}
.thumb{width:52px;height:52px;border-radius:12px;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.05rem;color:#fff;overflow:hidden;background-size:cover;background-position:center}
.thumb img{width:100%;height:100%;object-fit:cover}
.item .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.item .nm{font-weight:700;font-size:1rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .ds{font-size:.88rem;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pill{font-size:.72rem;font-weight:700;padding:5px 9px;border-radius:8px;flex:none;white-space:nowrap}
.pill.want{background:var(--accent-soft);color:var(--accent)}
.pill.been{background:var(--been-soft);color:var(--been)}
.pill.ink{background:var(--ink);color:var(--ink-fg)}
.pill.plain{background:var(--line2);color:var(--fg)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.drop{border:2px dashed var(--line);border-radius:16px;padding:14px 16px;display:flex;gap:12px;align-items:center;color:var(--soft);font-size:.95rem;line-height:1.35}

.rate-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.stars{display:flex;gap:6px}
.stars button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:1.3rem;cursor:pointer;color:var(--accent)}

/* plan */
.step{display:flex;flex-direction:column;gap:8px}
.step .lab{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:11px 18px;font-weight:600;cursor:pointer;min-height:44px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 6px;font-weight:600;cursor:pointer;min-height:48px}
.tile[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.newname{display:flex;gap:8px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px}
.pick.best{border:2px solid var(--ink)}
.pick .ph{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pick .pn{font-family:var(--display);font-weight:600;font-size:1.25rem;line-height:1.2}
.pick .why{font-size:.92rem;color:var(--soft);line-height:1.4}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border-radius:12px;padding:12px 16px;font-weight:700;font-size:.95rem;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg);text-decoration:none;text-align:center;min-height:44px}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ink{background:var(--ink);color:var(--ink-fg);border-color:var(--ink)}
.btn.flex{flex:1}
.btn.danger{color:#c43d3d;border-color:transparent;background:none;padding-inline:4px}
.btn[disabled]{opacity:.6;cursor:default}
.when{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end}

/* people */
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;width:100%;text-align:left;padding:0}
.pcard .band{display:flex;align-items:flex-end;gap:12px;padding:16px;min-height:96px}
.pcard .av{width:60px;height:60px;font-size:1.5rem;border:3px solid var(--surface)}
.pcard .pn{font-family:var(--display);font-weight:600;font-size:1.35rem;line-height:1.1}
.pcard .met{font-size:.85rem;color:var(--soft)}
.pcard .facts{padding:12px 16px 16px;display:flex;flex-direction:column;gap:8px}
.fact{display:flex;gap:10px;font-size:.95rem}
.fact span:first-child{width:84px;flex:none;color:var(--muted);font-weight:600}
.history{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:8px}
.hrow{display:flex;justify-content:space-between;gap:10px;font-size:.95rem;border-bottom:1px solid var(--line2);padding-bottom:8px}
.hrow:last-of-type{border-bottom:0;padding-bottom:0}

/* spots */
.search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:none;padding:8px 14px;min-height:38px;font-size:.88rem}
.empty{text-align:center;padding:36px 16px;color:var(--muted);border:1px dashed var(--line);border-radius:16px}
.empty strong{display:block;color:var(--fg);font-family:var(--display);font-size:1.15rem;margin-bottom:4px}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  padding-top:8px;padding-bottom:calc(env(safe-area-inset-bottom, 0px) + 10px);
  padding-left:max(0px, env(safe-area-inset-left, 0px));padding-right:max(0px, env(safe-area-inset-right, 0px))}
.nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--muted);cursor:pointer;padding:4px 0;min-height:48px}
.nav button[aria-current="page"]{color:var(--accent);font-weight:700}

/* sheets */
.sheet-bg{position:fixed;inset:0;background:rgba(10,5,12,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);color:var(--fg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0;
  padding-block:20px calc(env(safe-area-inset-bottom, 0px) + 20px);
  padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px));
  display:flex;flex-direction:column;gap:14px}
.sheet h2{font-size:1.4rem}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.full{grid-column:1/-1}
.field label{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.field input,.field select,.field textarea{padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:inherit;width:100%;min-height:44px}
.field textarea{min-height:76px;resize:vertical}
.rate{display:flex;gap:4px}
.rate button{background:none;border:0;font-size:1.7rem;cursor:pointer;color:var(--line);padding:0 3px;line-height:1;min-height:40px}
.rate button.on{color:var(--accent)}
.actions{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.confirm{font-size:.9rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.check{display:flex;gap:8px;align-items:center;font-size:.95rem}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.photo{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:12px;background:var(--bg)}
.ph-actions{display:flex;gap:8px;flex-wrap:wrap}
.ph-actions input{position:absolute;width:1px;height:1px;opacity:0}
.dates{display:flex;flex-direction:column;gap:8px}
.date-row{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.date-row.past{opacity:.75}
.mini{font-weight:600;font-size:.82rem;padding:8px 11px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-height:36px}
.mini.done{color:var(--been);border-color:transparent;background:var(--been-soft);cursor:default}
.sheet-links{display:flex;gap:14px;flex-wrap:wrap;font-weight:600;font-size:.92rem}
.sheet-links a{text-decoration:none}

/* sexy home */
.homehero{position:relative;border:0;width:100%;min-height:300px;border-radius:26px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;text-align:left;color:#fff;cursor:pointer;background:linear-gradient(145deg,#2a0f1d,#5e1736 55%,#b0245a);background-size:cover;background-position:center;box-shadow:0 18px 40px -18px rgba(60,10,30,.55);overflow:hidden}
.hh-top{display:flex;justify-content:space-between;align-items:center}
.hh-greet{font-size:.8rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.hh-me{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800}

.tile2.ph{background-size:cover!important;background-position:center!important;text-shadow:0 1px 8px rgba(0,0,0,.4)}
.evrow{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;padding-bottom:2px}
.evrow::-webkit-scrollbar{display:none}
.ev{flex:none;width:72%;max-width:280px;scroll-snap-align:start;background:var(--ink);color:var(--ink-fg);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;text-decoration:none;border:0;text-align:left;cursor:pointer}
.ev .evd{display:flex;gap:10px;align-items:center}
.ev .evdate{background:var(--accent);color:#fff;border-radius:10px;padding:5px 8px;text-align:center;line-height:1.05;flex:none}

.gallery{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;border-radius:14px}
.gallery::-webkit-scrollbar{display:none}

/* her ratings */
.prate{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:600}

.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--line);padding:4px;border-radius:12px}

.lrow{border-bottom:1px solid var(--line2);display:flex;align-items:center;gap:10px}

.lrm{border:0;background:none;color:#c43d3d;font-weight:700;padding:14px 16px;cursor:pointer}
.bubbles{display:flex;flex-direction:column;gap:10px}
.bubble{align-self:flex-end;max-width:92%;background:var(--accent);color:var(--accent-fg);border-radius:18px 18px 4px 18px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;font-size:1rem;line-height:1.4}
.bubble .bacts{display:flex;gap:6px;justify-content:flex-end}
.bubble .mini{background:rgba(255,255,255,.2);border-color:transparent;color:inherit}
/* home A+C */
.dates-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.dates-card .lbl{font-size:.75rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.drow{display:flex;gap:12px;align-items:center;background:none;border:0;padding:2px 0;cursor:pointer;width:100%;color:inherit}
.dchip{width:52px;flex:none;text-align:center;background:var(--line2);color:var(--soft);border-radius:12px;padding:6px 0;display:flex;flex-direction:column;line-height:1.1}
.dchip.on{background:var(--accent);color:var(--accent-fg)}
.dchip small{font-size:.68rem;font-weight:700}
.dchip b{font-family:var(--display);font-weight:800;font-size:1.35rem}
.tiles2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

<script>
const imgSrc=id=>{id=String(id||"");return /^https?:\/\//.test(id)?id:id.startsWith("d/")?"https://drive.google.com/thumbnail?id="+id.slice(2)+"&sz=w1600":"img/"+id+".jpg"};
document.addEventListener("error",e=>{const t=e.target;if(t&&t.tagName==="IMG"&&/^https?:/.test(t.getAttribute("src")||"")&&t.closest(".gallery")&&t.parentNode.querySelectorAll("img").length>1)t.remove()},true);

const ME="Kas";
const TYPES=["Drinks","Dinner","Coffee","Activity","Active","Outdoors","Late night"];
const BOROS=["Brooklyn","Queens","Manhattan","Other"];
const VIBES=["Chill","Romantic","Lively","Impressive","Fun","Low-key"];
const BEST=["First date","Second date","Special night","Any"];
const PSTAT=["Talking","Date set","Dating","Done"];
const VIBE_TYPES={"Chill drinks":["Drinks","Coffee"],"Music & dancing":["Late night"],"Dinner":["Dinner"],"Something fun":["Activity","Outdoors"],"Active / sporty":["Active"]};
const AREAS=["Williamsburg / Greenpoint","Manhattan","Near home","Astoria / LIC","Anywhere in Brooklyn"];
const STYLES=["Cocktail bars","Music / dancing","Something active or different","Nice dinner"];
const BUDGETS=["Under $80","$80–150","$150–300","Depends on the girl"];
const AVOIDS=["Too loud to talk","Long waits / lines","Touristy spots"];
const DLISTS=[["events","Happening soon"],["new","New & buzzing"],["cocktails","Cocktail bars for you"],["music","Music & dancing"],["different","Something different"]];
const S={view:"home",spots:[],people:[],discover:[],profile:null,sample:null,ask:{q:"",a:"",busy:false,err:""},db:null,assets:null,mcp:null,loading:true,
  q:"",fSrc:"All",fStatus:"All",fArea:"All",fType:"All",dType:"All",dArea:"All",plan:{who:"",newName:"",vibe:"",area:"",chosen:""}};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const ICON={pin:`<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M15 3l6 6-3 1-4 4 1 5-2 2-4-4-5 5-1-1 5-5-4-4 2-2 5 1 4-4z"/></svg>`,
  plus:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  arrow:'<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>',
  chev:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>',
  cam:'<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><circle cx="12" cy="12" r="3.5"/></svg>'
};

/* ---------- helpers ---------- */
function hashHue(s){let h=0;for(const c of String(s||""))h=(h*31+c.charCodeAt(0))%360;return h}
function initials(n){return String(n||"?").replace(/^(the|bar)\s+/i,"").split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join("").toUpperCase()}
function avStyle(n){const h=hashHue(n);return `background:hsl(${h} 45% 88%);color:hsl(${h} 55% 30%)`}
const TYPE_HUE={Drinks:330,Dinner:15,Coffee:35,Activity:265,Active:190,Outdoors:150,"Late night":230};
function thumb(s){
  const pid=s.photoId||(s.photos&&s.photos[0]);
  if(!pid&&s.photoUrl)return `<span class="thumb" style="background:var(--fill)"><img src="${esc(s.photoUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()"></span>`;
  if(pid)return `<span class="thumb"><img src="${esc(imgSrc(pid))}" alt="" loading="lazy"></span>`;
  const h=TYPE_HUE[s.type]??hashHue(s.name);
  return `<span class="thumb" style="background:linear-gradient(135deg,hsl(${h} 55% 40%),hsl(${(h+38)%360} 60% 25%))">${esc(initials(s.name))}</span>`;
}
function parseLocal(s){if(!s)return null;const[d,t]=s.split("T");const[y,m,dd]=d.split("-").map(Number);const[h,mi]=(t||"00:00").split(":").map(Number);return new Date(y,m-1,dd,h,mi)}
function fmtWhen(s){const d=parseLocal(s);if(!d)return "";return d.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"})+" · "+d.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}
function fmtDay(s){const d=parseLocal(s);return d?d.toLocaleDateString(undefined,{month:"short",day:"numeric"}):""}
function relDay(s){const d=parseLocal(s);if(!d)return "";const t=new Date();t.setHours(0,0,0,0);const x=new Date(d);x.setHours(0,0,0,0);const n=Math.round((x-t)/864e5);
  return n===0?"Tonight":n===1?"Tomorrow":n>1&&n<7?d.toLocaleDateString(undefined,{weekday:"long"}):fmtDay(s)}
const GRACE=3*36e5;
function upcoming(p){const now=Date.now();return (p.dates||[]).filter(d=>parseLocal(d.when)>=now-GRACE).sort((a,b)=>parseLocal(a.when)-parseLocal(b.when))}
function pastDates(p){const now=Date.now();return (p.dates||[]).filter(d=>parseLocal(d.when)<now-GRACE).sort((a,b)=>parseLocal(b.when)-parseLocal(a.when))}
function spotOf(d){return S.spots.find(x=>x.id===d.spotId)}
function placeName(d){const s=spotOf(d);return s?s.name:(d.spotName||"Somewhere")}
function mapUrl(s){return "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(s.address?[s.name,s.address].filter(Boolean).join(", "):[s.name,s.area,s.borough,"NY"].filter(Boolean).join(" "))}
function resyUrl(s){return "https://resy.com/cities/new-york-ny/search?query="+encodeURIComponent(s.name)}
function otUrl(s){return "https://www.opentable.com/s?metroId=8&term="+encodeURIComponent(s.name)}
function igHandle(h){h=String(h||"").trim();if(!h)return "";const m=h.match(/instagram\.com\/([A-Za-z0-9._]+)/i);return (m?m[1]:h).replace(/^@/,"").replace(/[^A-Za-z0-9._]/g,"")}
function igUrl(h,name,area){const x=igHandle(h);return x?"https://www.instagram.com/"+x+"/":"https://www.google.com/search?q="+encodeURIComponent([name,area,"NYC instagram"].filter(Boolean).join(" "))}
function avatar(p,style){return `<span class="av" style="${style||""}">${p.photoId?`<img src="${esc(imgSrc(p.photoId))}" alt="">`:esc(initials(p.name))}</span>`}
const PLAT={resy:"Resy",opentable:"OpenTable",tock:"Tock",sevenrooms:"SevenRooms","own site":"their site",tickets:"tickets"};
function safeUrl(u){return /^https:\/\//i.test(u||"")?u:""}
function bookLinks(s){
  const u=safeUrl(s.bookingUrl);
  if(u){const p=PLAT[s.bookingPlatform]||"their site";return `<a href="${esc(u)}" target="_blank" rel="noopener">${s.type==="Activity"?"Get tickets":"Book on "+p}</a>`}
  if(s.bookingPlatform==="walk-in only")return `<span class="muted">Walk-in only, no booking needed</span>`;
  if(!bookable(s))return "";
  return `<a href="${resyUrl(s)}" target="_blank" rel="noopener">Resy</a><a href="${otUrl(s)}" target="_blank" rel="noopener">OpenTable</a>`;
}
function bookable(s){return ["Dinner","Drinks","Coffee","Late night",""].includes(s.type||"")}
function greeting(){const h=new Date().getHours();return h<5?"Late night":h<12?"Good morning":h<17?"Good afternoon":"Good evening"}
function isShabbat(w){const d=parseLocal(w);if(!d)return false;const day=d.getDay(),h=d.getHours()+d.getMinutes()/60;return (day===5&&h>=16)||(day===6&&h<19.5)}
function shabbatSafeWhen(){const d=new Date();d.setDate(d.getDate()+(((6-d.getDay())+7)%7||7));return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T20:30`}
function defaultWhen(){const d=new Date();d.setDate(d.getDate()+(((5-d.getDay())+7)%7||7));return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T20:00`}
function allPast(){const out=[];S.people.forEach(p=>pastDates(p).forEach(d=>out.push({p,d})));return out.sort((a,b)=>parseLocal(b.d.when)-parseLocal(a.d.when))}
function allUpcoming(){const out=[];S.people.forEach(p=>upcoming(p).forEach(d=>out.push({p,d})));return out.sort((a,b)=>parseLocal(a.d.when)-parseLocal(b.d.when))}
function beenWith(spot){const names=new Set();allPast().forEach(({p,d})=>{if(d.spotId===spot.id)names.add(p.name)});if(spot.wentWith)spot.wentWith.split(/,\s*/).filter(Boolean).forEach(n=>names.add(n));return [...names]}

/* ---------- navigation ---------- */
function go(v){S.view=v;try{history.replaceState(null,"","#"+v)}catch(e){}render();const _s=document.getElementById("scr");if(_s)_s.scrollTop=0}
function render(){
  ["home","plan","spots","people","discover","book","me","cal"].forEach(v=>$("v-"+v).hidden=S.view!==v);
  ["home","discover","spots","people","book"].forEach(v=>{const b=$("n-"+v);if(S.view===v||(v==="home"&&(S.view==="plan"||S.view==="me"||S.view==="cal")))b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
  placeLens();
  if(S.view==="home")renderHome();else if(S.view==="cal")renderCal();else if(S.view==="me")renderMe();else if(S.view==="plan")renderPlan();else if(S.view==="spots")renderSpots();else if(S.view==="discover")renderDiscover();else if(S.view==="book")renderBook();else renderPeople();
}

/* ---------- calendar ---------- */
function calItems(){const out=[];
  for(const p of S.people){if(!vis(p))continue;
    for(const d of (p.dates||[])){if(!d.when)continue;out.push({day:d.when.slice(0,10),time:d.when.slice(11,16),kind:"date",title:`${p.name} · ${placeName(d)}`,sub:(spotOf(d)||{}).area||d.address||"",img:p.photoId?imgSrc(p.photoId):"",round:1,act:`data-act="date:${esc(p.id)}:${esc(d.id)}"`})}
    if(p.birthday&&p.status!=="Done"){const [y,m,dd]=p.birthday.split("-");const t=new Date();for(const yr of [t.getFullYear(),t.getFullYear()+1])out.push({day:`${yr}-${m}-${dd}`,time:"",kind:"bday",title:`${p.name}'s birthday`,sub:"Send a gift?",img:p.photoId?imgSrc(p.photoId):"",round:1,act:`data-act="person:${esc(p.id)}"`})}}
  for(const x of S.discover){if(x.list!=="events"||!x.date)continue;const pid=(x.photos&&x.photos[0])||x.photoId;
    out.push({day:x.date,time:"",kind:"event",title:x.name,sub:[x.time,x.venue||x.area].filter(Boolean).join(" · "),img:pid?imgSrc(pid):(x.photoUrl||""),act:`data-idea="${esc(x.id)}"`})}
  return out.sort((a,b)=>(a.day+a.time).localeCompare(b.day+b.time))}
const CALC={date:"#ff375f",event:"#ffd60a",bday:"#30d158"};
function calRow(it){return `<button class="calrow" ${it.act}>${it.img?`<img src="${esc(it.img)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.visibility='hidden'" style="${it.round?"border-radius:50%":""}">`:`<span class="calph"></span>`}<span class="calt"><b>${esc(it.title)}</b><span>${esc([it.time&&fmtT(it.time),it.sub].filter(Boolean).join(" · "))}</span></span><span class="caltag" style="background:${CALC[it.kind]};color:${it.kind==="event"?"#000":"#fff"}">${it.kind==="date"?"Date":it.kind==="event"?"Event":"Birthday"}</span></button>`}
function fmtT(t){if(!/^\d\d:\d\d$/.test(t))return "";const [h,m]=t.split(":").map(Number);return ((h+11)%12+1)+(m?":"+String(m).padStart(2,"0"):"")+(h<12?" AM":" PM")}
function renderCal(){
  const t=new Date();if(!S.calM)S.calM=t.getFullYear()+"-"+pad(t.getMonth()+1);if(!S.calSel)S.calSel=todayStr();
  const [Y,M]=S.calM.split("-").map(Number);const first=new Date(Y,M-1,1),days=new Date(Y,M,0).getDate();
  const items=calItems();const by={};items.forEach(i=>(by[i.day]=by[i.day]||[]).push(i));
  let cells="";for(let i=0;i<first.getDay();i++)cells+=`<span></span>`;
  for(let d=1;d<=days;d++){const k=`${Y}-${pad(M)}-${pad(d)}`;const its=by[k]||[];const kinds=[...new Set(its.map(i=>i.kind))];
    cells+=`<button class="cald${k===S.calSel?" sel":""}${k===todayStr()?" tdy":""}" data-cald="${k}">${d}<span class="caldots">${kinds.map(x=>`<i style="background:${CALC[x]}"></i>`).join("")}</span></button>`}
  const list=S.calMode==="list";const lim90=(()=>{const d=new Date();d.setDate(d.getDate()+120);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())})();const upcoming=items.filter(i=>i.day>=todayStr()&&i.day<=lim90).slice(0,60);
  const selD=parseLocal(S.calSel+"T12:00");
  $("v-cal").innerHTML=`<div class="top"><button class="round" data-go="home" aria-label="Back">${ICON.back||"‹"}</button><h1 style="flex:1;margin-left:10px">Calendar</h1></div>
    <div class="seg"><button aria-pressed="${!list}" data-calmode="month">Month</button><button aria-pressed="${list}" data-calmode="list">List</button></div>
    ${list?(upcoming.length?groupDays(upcoming):`<div class="empty"><strong>Nothing coming up</strong>Plan a date or save an event.</div>`):`
    <div class="calhead"><button class="round" data-calnav="-1" aria-label="Previous month">‹</button><h2>${first.toLocaleDateString(undefined,{month:"long",year:"numeric"})}</h2><button class="round" data-calnav="1" aria-label="Next month">›</button></div>
    <div class="calgrid">${["S","M","T","W","T","F","S"].map(x=>`<span class="calw">${x}</span>`).join("")}${cells}</div>
    <div class="callegend"><span><i style="background:${CALC.date}"></i>Dates</span><span><i style="background:${CALC.event}"></i>Events</span><span><i style="background:${CALC.bday}"></i>Birthdays</span></div>
    <span class="bklab">${esc(selD.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}))}</span>
    ${(by[S.calSel]||[]).length?`<div class="callist">${by[S.calSel].map(calRow).join("")}</div>`:`<div class="empty" style="padding:18px">Nothing planned. <button class="link" data-go="plan">Plan a date</button></div>`}`}`;
}
function groupDays(arr){let h="",cur="";for(const it of arr){if(it.day!==cur){cur=it.day;h+=`<span class="bklab">${esc(relDay(it.day+"T12:00")||parseLocal(it.day+"T12:00").toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"}))}</span>`}h+=calRow(it)}return `<div class="callist">${h}</div>`}

/* ---------- map ---------- */
function loadLeaflet(){if(window.L)return Promise.resolve();return new Promise((res,rej)=>{
  const l=document.createElement("link");l.rel="stylesheet";l.href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css";document.head.appendChild(l);

function planPicks(){
  const P=S.plan;const area=P.area||"Anywhere";
  const types=P.vibe?(VIBE_TYPES[P.vibe]||[]):null;
  const person=S.people.find(p=>p.id===P.who);const pname=person?person.name:P.newName;
  let list=S.spots.filter(s=>!s.closed&&(!person||!person.keepsKosher||s.kosher)&&(!types||types.includes(s.type))&&(area==="Anywhere"||s.borough===area));
  return list.map(s=>{
    const withNames=beenWith(s);const repeat=pname&&withNames.includes(pname);
    let score=0,why="";
    if(repeat){score-=10;why=`You already took ${pname} here. Pick it only if you want a repeat.`}
    else if(s.status==="Been"&&s.rating>=4){score+=3+s.rating*.5;why=`You loved it last time (${"★".repeat(s.rating)}).`}
    else if(s.status==="Been"&&withNames.length){score+=1;why=`You've been with ${withNames.join(", ")}. Fine for someone new.`}
    else if(s.status!=="Been"){score+=4;why=s.notes||"On your want-to-try list."}
    else{score+=1;why=s.notes||""}
    if(person&&person.kind==="Serious"&&["Romantic","Impressive"].includes(s.vibe))score+=1.5;
    if(person&&person.kind==="Sneaky link"){if(["Late night","Drinks"].includes(s.type)&&["Chill","Low-key","Lively","Fun"].includes(s.vibe))score+=1.5;if(s.price==="$$$$")score-=1}
    const pr=S.profile||{};const ar=(pr.areas||[]).join(" ").toLowerCase();
    if((ar.includes("williamsburg")&&/williamsburg|greenpoint/i.test(s.area||""))||(ar.includes("manhattan")&&s.borough==="Manhattan")||(pr.home&&s.area&&s.area.toLowerCase().includes(pr.home.toLowerCase())))score+=1.5;
    if(person&&person.likes&&s.notes&&person.likes.toLowerCase().split(/[ ,]+/).some(w=>w.length>3&&s.notes.toLowerCase().includes(w))){score+=2;why=`Matches what ${pname} likes. `+why}
    return {s,score,why,repeat};
  }).sort((a,b)=>b.score-a.score||(b.s.updatedAt||0)-(a.s.updatedAt||0));
}

function swipeRow(w){
  const it=w.querySelector(".item"),L=w.querySelector(".sw-act.l"),R=w.querySelector(".sw-act.r");
  let x0=null,y0=0,dx=0,pos=0,moved=false,lp=null,lpDone=false;
  const set=(v,anim)=>{it.style.transition=anim?"transform .2s":"none";it.style.transform=v?`translateX(${v}px)`:"";L.style.visibility=v>0?"visible":"hidden";R.style.visibility=v<0?"visible":"hidden"};
  const closeOthers=()=>document.querySelectorAll(".sw").forEach(o=>{if(o!==w&&o._close)o._close()});
  w._close=()=>{pos=0;set(0,true)};
  const start=(x,y)=>{x0=x;y0=y;dx=pos;moved=false;lpDone=false;clearTimeout(lp);
    lp=setTimeout(()=>{if(!moved&&x0!==null){lpDone=true;x0=null;if(navigator.vibrate)navigator.vibrate(15);togglePin(w.dataset.pid)}},550)};
  const move=(x,y,e)=>{if(x0===null)return;const d=x-x0,dy=y-y0;

    pos=dx>40?84:dx<-40?-84:0;set(pos,true);

  it.addEventListener("touchstart",e=>{const t=e.touches[0];start(t.clientX,t.clientY)},{passive:true});
  it.addEventListener("touchmove",e=>{const t=e.touches[0];move(t.clientX,t.clientY,e)},{passive:false});
  it.addEventListener("touchend",e=>{if(lpDone){e.preventDefault()}end()});

  it.addEventListener("mousedown",e=>start(e.clientX,e.clientY));

}

    const grouped=list=>`<div class="lines">${list.map(placeRow).join("")}</div>`;const _g=list=>{const used=new Set();return GROUPS.map(([t,fn])=>{const g=list.filter(s=>!used.has(s)&&fn(s));g.forEach(s=>used.add(s));return g.length?`<span class="muted" style="font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-top:4px">${t}</span>`+g.map(spotRow).join(""):""}).join("")};
    const mine=rows,sug=[];
    const filtered=S.pf!=="All"||S.ps!=="All"||q;
    L.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:1.05rem;font-weight:600">${rows.length} places</span>${filtered?`<button class="btn" data-act="pfreset" style="min-height:36px;padding:6px 16px;border-radius:999px">Reset</button>`:""}</div>`+
      (mine.length?grouped(mine):"")+
      (sug.length?`<h2 style="margin-top:10px">Suggested by Claude <span class="muted" style="font-size:.9rem;font-weight:500">${sug.length}</span></h2>`+grouped(sug):"")}
  if(!S.loading&&S.db)L.insertAdjacentHTML("beforeend",recBlock(PFT));
}
function recBlock(PFT){
  const okT=x=>S.pf==="All"||(S.pf==="Rooftop"?isRoof(x):typeOk(x,PFT[S.pf]));
  const okS=x=>S.ps!=="Kosher"||x.kosher;
  const hasPh=x=>!!((x.photos||[]).length||x.photoId);
  const pool=[...S.spots.filter(x=>!x.closed&&!isMine(x)).map(x=>({k:"s",x})),
    ...S.discover.filter(d=>d.list!=="events"&&!isSaved(d)).map(x=>({k:"d",x}))].filter(({x})=>okT(x)&&okS(x))
    .sort((a,b)=>hasPh(b.x)-hasPh(a.x)||(fitScore?fitScore(b.x)-fitScore(a.x):0));
  if(!pool.length)return "";
  const n=Math.min(S.recN||5,pool.length);S.recOff=S.recOff||0;if(S.recOff>=pool.length)S.recOff=0;
  const pick=[...pool.slice(S.recOff,S.recOff+n),...(S.recOff+n>pool.length?pool.slice(0,Math.min(S.recOff,S.recOff+n-pool.length)):[])];
  return `<div class="recs"><div class="rech"><div><h2 style="margin:0">Recommended</h2><span class="muted" style="font-size:.85rem">Tap + to add. More in Discover.</span></div>${pool.length>n?`<button class="link" data-act="recmore">Refresh</button>`:""}</div>
    <div class="lines recl">${pick.map(({k,x})=>`<div class="lrow"><button class="lcopy" ${k==="s"?`data-act="spot:${esc(x.id)}"`:`data-idea="${esc(x.id)}"`}>${thumb(x)}<span class="ltext" style="display:flex;flex-direction:column;gap:1px;min-width:0"><span style="font-weight:600">${esc(x.name)}</span><span class="muted" style="font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc([x.area,x.type==="Drinks"?"Bar":x.type,x.price].filter(Boolean).join(" · "))}</span></span></button><button class="recadd" ${k==="s"?`data-fav="${esc(x.id)}"`:`data-isave="${esc(x.id)}"`} aria-label="Add ${esc(x.name)} to my places">+</button></div>`).join("")}</div>
    ${pool.length>n?`<button class="btn recmorebtn" data-act="recplus">Show more</button>`:""}</div>`;
}

async function dateOutcome(pid,did,o){

  try{await S.db.collection("people").doc(pid).set(body)}catch(e){toast("Couldn't save. Try again.");return}

  else if(o==="great"){S.plan={who:pid,newName:"",vibe:"",area:"",chosen:""};toast(`Nice. Let's plan the next one with ${person.name}`);go("plan")}
  else toast("Got it");
}

async function rateDate(pid,did,n){
  const person=S.people.find(p=>p.id===pid);if(!person||!S.db)return;
  const {id,...body}=JSON.parse(JSON.stringify(person));const d=body.dates.find(x=>x.id===did);if(!d)return;
  d.rated=true;if(n)d.rating=n;
  try{await S.db.collection("people").doc(pid).set(body)}catch(e){toast("Couldn't save. Try again.");return}
  const s=spotOf(d);
  if(s&&n){const names=new Set((s.wentWith||"").split(/,\s*/).filter(Boolean));names.add(person.name);
    const {id:_,...sb}=s;try{await S.db.collection("spots").doc(s.id).set({...sb,status:"Been",rating:n,wentWith:[...names].join(", "),updatedAt:Date.now()})}catch(e){}}
  toast(n?"Got it. Saved to your history.":"Skipped");
}
async function addToCalendar(p,d){
  if(!S.mcp){toast("Calendar isn't available here");return false}
  const st=parseLocal(d.when),en=new Date(st.getTime()+(d.len||120)*6e4);
  const iso=x=>`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}T${pad(x.getHours())}:${pad(x.getMinutes())}:00`;
  const sp=spotOf(d);const location=sp?(sp.address?sp.name+", "+sp.address:[sp.name,sp.area,sp.borough,"NY"].filter(Boolean).join(", ")):(d.address||d.spotName);
  const description=[d.notes,sp?mapUrl(sp):""].filter(Boolean).join("\n");
  try{await S.mcp.callTool("Google Calendar","create_event",{summary:`Date with ${p.name}`,startTime:iso(st),endTime:iso(en),location,description,useDefaultReminders:true});toast("Saved and added to Google Calendar");return true}
  catch(e){const m={needs_reauth:"Reconnect Google Calendar in claude.ai Settings → Connectors",server_not_connected:"Add Google Calendar in claude.ai Settings → Connectors",approval_required:"Allow calendar access when asked, then tap “Add to calendar” on her card",not_in_manifest:"Calendar access is turned off for this page",blocked_by_policy:"Your account blocks calendar access here",tool_error:"Google Calendar couldn't create the event",server_unavailable:"Calendar didn't answer. Check it before trying again"};
    toast("Date saved. "+(m[e&&e.code]||"Couldn't add it to your calendar. Check it before trying again"));return false}
}
function nextBday(b){if(!b)return null;const[ , m,d]=b.split("-").map(Number);if(!m||!d)return null;const t=new Date();t.setHours(0,0,0,0);let n=new Date(t.getFullYear(),m-1,d);if(n<t)n=new Date(t.getFullYear()+1,m-1,d);return n}
function bdaySoon(){return S.people.filter(p=>p.birthday&&p.status!=="Done").map(p=>{const n=nextBday(p.birthday);return {p,n,days:n?Math.round((n-new Date(new Date().setHours(0,0,0,0)))/864e5):999}}).filter(x=>x.days<=21).sort((a,b)=>a.days-b.days)}
async function addBirthday(p){
  if(!S.mcp){toast("Calendar isn't available here");return false}
  const n=nextBday(p.birthday);if(!n){toast("Add her birthday first");return false}
  const e=new Date(n.getTime()+864e5);const f=x=>`${x.getFullYear()}-${pad(x.getMonth()+1)}-${pad(x.getDate())}T00:00:00`;
  try{await S.mcp.callTool("Google Calendar","create_event",{summary:`${p.name}'s birthday`,allDay:true,startTime:f(n),endTime:f(e),recurrenceData:["RRULE:FREQ=YEARLY"],description:"Reminder from your date tracker. Plan something or send a gift.",overrideReminders:[{method:"popup",minutes:4320},{method:"popup",minutes:600}]});toast("Added. You'll get a reminder 3 days before, every year");return true}
  catch(err){const m={needs_reauth:"Reconnect Google Calendar in claude.ai Settings → Connectors",server_not_connected:"Add Google Calendar in claude.ai Settings → Connectors",approval_required:"Allow calendar access when asked, then try again",not_in_manifest:"Calendar access is turned off for this page"};toast(m[err&&err.code]||"Couldn't add it. Check your calendar before trying again");return false}
}
async function shrink(file){try{const img=await createImageBitmap(file);const k=Math.min(1,1400/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);const b=await new Promise(r=>c.toBlob(r,"image/jpeg",.85));return b||file}catch(e){return file}}

  if(kind!=="movies"){
    jobs.push(S.mcp.callTool("StubHub","event-search",{query:q,intent_level:"HIGH_INTENT",location_coordinates:"40.7128, -74.0060",event_start_date:today},{cache:{maxAge:3600}}).then(r=>{
      const p=r.payload||{};(p.events||[]).forEach(e=>{const g=e.grpcMetadata||{};out.push({id:"sh-"+e.entityId,list:"events",name:g.DisplayValueEnglish||g.DisplayValueDefault||q,venue:g.VenueName||"",area:g.VenueName||"",date:shDate(g.EventDateTimeLocalShort),time:shTime(g.EventDateTimeLocalShort),price:e.formattedMinPrice?("From "+e.formattedMinPrice):"",photoUrl:e.imageUrl||"",ticketUrl:"https://www.stubhub.com/event/"+e.entityId,source:"stubhub"})})}).catch(e=>console.warn("stubhub",e)));
    jobs.push(S.mcp.callTool("Fever Event Discovery","search_events",{city_code:"NYC",query:q,page_size:12},{cache:{maxAge:3600}}).then(r=>{
      const p=r.payload||{};(p.results||[]).forEach(e=>{const st=(e.session_start_times||[])[0]||"";out.push({id:"fv-"+e.id,list:"events",name:e.name,venue:e.location||"",area:(e.location||"").replace(/, New York$/,""),date:st.slice(0,10),time:st?new Date(st).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}):"",price:e.price||"",photoUrl:e.cover_image_url||"",ticketUrl:e.url,source:"fever"})})}).catch(e=>console.warn("fever",e)));
  }
  await Promise.all(jobs);
  return {items:out.filter(x=>x.date).sort((a,b)=>a.date.localeCompare(b.date))};
}
async function liveMovies(q){
  if(!S.mcp)return {err:"Movie times work inside the Claude app."};
  const t=new Date();const st=todayStr()+"T"+pad(Math.max(t.getHours(),12))+":00:00";
  try{const r=await S.mcp.callTool("Fever Event Discovery","search_movie_showtimes",{city_code:"NYC",query:q||"",start_datetime:st,max_movies:8,max_cinemas_per_movie:3,max_showtimes_per_cinema:4},{cache:{maxAge:1800}});
    return {movies:(r.payload||{}).movies||[]}}catch(e){return {err:"Couldn't load movie times right now."}}
}
function liveCard(x){
  const saved=S.discover.some(d=>d.id===x.id);const h=hashHue(x.name);
  const badge=x.date?parseLocal(x.date+"T12:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}):"";
  return `<div class="uecard"><span class="ueimg">${x.photoUrl?`<img src="${esc(x.photoUrl)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}<span class="ueph" style="position:absolute;inset:0;z-index:-1;background:linear-gradient(135deg,hsl(${h} 45% 30%),hsl(${(h+40)%360} 50% 18%))">🎟️</span>${badge?`<span class="uebadge">${esc(badge)}</span>`:""}</span>
    <span class="uerow"><span class="uenm">${esc(x.name)}</span>${saved?`<span class="dadd on">✓</span>`:`<span class="dadd" data-lsave="${esc(x.id)}" role="button" aria-label="Save event">+</span>`}</span>
    <span class="uesub">${esc([x.time,x.venue,x.price].filter(Boolean).join(" · "))}</span>
    <a class="btn" href="${esc(x.ticketUrl)}" target="_blank" rel="noopener" style="margin-top:6px;align-self:flex-start;border-radius:999px;min-height:36px;padding:6px 16px">Tickets on ${x.source==="stubhub"?"StubHub":"Fever"}</a></div>`;
}
function movieBlock(m){
  return `<div class="mvcard">${m.cover_image_url?`<img src="${esc(m.cover_image_url)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}<div style="display:flex;flex-direction:column;gap:6px;min-width:0;flex:1">
    <b>${esc(m.title)}</b><a class="mvtrl" href="https://www.youtube.com/results?search_query=${encodeURIComponent(m.title+" official trailer")}" target="_blank" rel="noopener">▶ Watch trailer</a><span class="muted" style="font-size:.82rem">${esc([m.advisory_rating,m.runtime_minutes?m.runtime_minutes+" min":"",(m.genres||[]).slice(0,2).join(", ")].filter(Boolean).join(" · "))}</span>
    ${(m.cinemas||[]).slice(0,3).map(c=>`<div style="font-size:.85rem"><span style="font-weight:600">${esc(c.name)}</span><div class="mvtimes">${(c.showtimes||[]).map(t=>`<a href="${esc(t.booking_url)}" target="_blank" rel="noopener">${esc(new Date(t.start_local).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"}))}</a>`).join("")}</div></div>`).join("")}
  </div></div>`;
}
async function runLive(kind){
  LIVE.busy=true;LIVE.err="";LIVE.kind=kind;renderDiscover();
  const r=kind==="movies"?await liveMovies(LIVE.q):await liveSearch(LIVE.q,kind);
  LIVE.busy=false;LIVE.items=r.items||null;LIVE.movies=r.movies||null;LIVE.err=r.err||"";renderDiscover();
}
async function saveLive(id){
  const x=(LIVE.items||[]).find(i=>i.id===id)||(LIVE.followItems||[]).find(i=>i.id===id);if(!x||!S.db)return;
  const {id:_,...body}=x;body.updatedAt=Date.now();body.why=body.why||"Found with live search.";
  try{await S.db.collection("discover").doc(id).set(body);toast("Saved to Events")}catch(e){toast("Couldn't save. Try again.")}
}
async function toggleFollow(name){
  if(!S.db)return;const p=S.profile||{};const f=[...(p.follow||[])];const i=f.findIndex(x=>x.toLowerCase()===name.toLowerCase());
  if(i>=0)f.splice(i,1);else f.push(name);
  try{await S.db.doc("me/profile").set({...p,follow:f,updatedAt:Date.now()});toast(i>=0?`Unfollowed ${name}`:`Following ${name}. Their NYC shows will show up in Events.`)}catch(e){toast("Couldn't save. Try again.")}
}
async function loadFollowed(){
  const f=(S.profile&&S.profile.follow)||[];if(!f.length||!S.mcp||LIVE.followBusy)return;
  const key=f.join("|");if(LIVE.followKey===key)return;LIVE.followKey=key;LIVE.followBusy=true;
  const all=[];for(const n of f.slice(0,8)){const r=await liveSearch(n,"events");(r.items||[]).forEach(x=>{x.artist=n;all.push(x)})}
  LIVE.followBusy=false;LIVE.followItems=all.sort((a,b)=>a.date.localeCompare(b.date));if(S.view==="discover")renderDiscover();
}

/* swipe from left edge = back; no pinch zoom */
(function(){
  const VS=[];const _go=go;
  go=function(v){if(v!==S.view){VS.push(S.view);if(VS.length>20)VS.shift()}_go(v)};
  function back(){
    const sr=$("sheet-root");if(sr&&sr.children.length){closeSheet();return true}
    while(VS.length){const p=VS.pop();if(p&&p!==S.view){_go(p);return true}}
    if(S.view!=="home"){_go("home");return true}
    return false;
  }
  window.kasBack=back;
  const ind=document.createElement("div");ind.className="swipe-back";ind.textContent="\u2039";document.body.appendChild(ind);
  let sx=0,sy=0,dx=0,on=false;
  const reset=()=>{on=false;ind.style.opacity="";ind.style.transform=""};
  addEventListener("touchstart",e=>{const t=e.touches[0];if(e.touches.length===1&&t.clientX<30){sx=t.clientX;sy=t.clientY;dx=0;on=true}},{passive:true});
  addEventListener("touchmove",e=>{if(!on)return;const t=e.touches[0];dx=t.clientX-sx;const dy=Math.abs(t.clientY-sy);
    if(dy>45&&dy>dx){reset();return}
    const p=Math.max(0,Math.min(dx,130));ind.style.opacity=Math.min(1,p/80);ind.style.transform="translate("+(p*0.55)+"px,-50%) scale("+(0.7+p/430)+")"},{passive:true});
  addEventListener("touchend",()=>{const go2=on&&dx>70;reset();if(go2)back()},{passive:true});
  addEventListener("touchcancel",reset,{passive:true});
  ["gesturestart","gesturechange"].forEach(n=>document.addEventListener(n,e=>e.preventDefault(),{passive:false}));
})();
</script>
